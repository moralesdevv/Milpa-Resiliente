[project]
name = "milpa-etl"
version = "0.1.0"
description = "MILPA RESILIENTE - R1: ingesta, curación, procedencia y paquete de demostración (CLI milpa-etl)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "pyyaml>=6",
  "requests>=2.32",
  "psycopg[binary]>=3.2",
  "pandera>=0.20",
]

[project.optional-dependencies]
# IMERG (fetch imerg / merge imerg): requieren credenciales NASA Earthdata y red
imerg = ["earthaccess>=0.9", "xarray>=2024.1", "h5netcdf>=1.3"]
# DEM Copernicus 30 m (fetch dem)
dem = ["rasterio>=1.3"]
# SoilGrids municipal extraction (tools/etl_soilgrids.py)
soilgrids = ["geopandas>=1.0", "shapely>=2.0", "requests>=2.32"]

[project.scripts]
milpa-etl = "milpa_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpa_etl"]

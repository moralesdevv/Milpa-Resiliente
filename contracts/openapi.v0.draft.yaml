openapi: 3.1.0
info:
  title: MILPA RESILIENTE API (R4 derived draft)
  version: 0.0.0-draft
  description: >-
    Provisional frontend contract derived only from MILPA RESILIENTE 3.3 §§13,
    15 and 16. It is not the R3 OpenAPI v0, is not signed, and must be reconciled
    against R2/R3 payloads before replacing or publishing an official contract.
servers:
  - url: http://localhost:8000
    description: Local development/API proxy; replace through Vite configuration.
security:
  - BearerAuth: []
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Create a short-lived session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session (R4 draft shape; R3 must confirm).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the current user profile.
      responses:
        '200':
          description: User profile; response fields are not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/zones:
    get:
      operationId: listZones
      summary: List accessible zones.
      responses:
        '200':
          description: Accessible zone summaries; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneSummaryDTO'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createZone
      summary: Create a zone and enqueue ingestion/curation.
      description: Technician/admin only; returns a 202 job in the API design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenObject'
      responses:
        '202':
          description: Job accepted (R4 draft Job shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Problem'
  /v1/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getZone
      summary: Read zone context and available sources.
      responses:
        '200':
          description: Zone context; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/zones/{id}/data-quality:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getZoneDataQuality
      summary: Read variable/year coverage and source sensitivity.
      responses:
        '200':
          description: Quality/cov­erage payload; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels:
    post:
      operationId: createParcel
      summary: Create a parcel without storing exact geometry in the MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenObject'
      responses:
        '201':
          description: Created parcel; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getParcel
      summary: Read an accessible parcel without exact geometry.
      responses:
        '200':
          description: Parcel; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelDTO'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteParcel
      summary: Enqueue definitive deletion of parcel data.
      responses:
        '202':
          description: Deletion job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels/{id}/soil:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getParcelSoil
      summary: Read status by soil property.
      responses:
        '200':
          description: One status per property.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SoilPropertyStatusDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels/{id}/soil-samples:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: uploadSoilSamples
      summary: Upload a soil CSV with row-level validation.
      description: >-
        The exact form field and response schema are not specified in §15; both
        remain open until R3 publishes its contract.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SoilUploadForm'
      responses:
        '200':
          description: Accepted properties and row-level errors; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilUploadResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels/{id}/soil-declarations/{property}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: property
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: declareSoilProperty
      summary: Store a declared soil property with its basis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoilDeclarationRequest'
      responses:
        '200':
          description: Updated property status; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilPropertyStatusDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/parcels/{id}/priority-profile:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updatePriorityProfile
      summary: Store declared criterion weights and constraints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenObject'
      responses:
        '200':
          description: Stored profile; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalog/crops:
    get:
      operationId: listCrops
      summary: Read the cited crop catalog.
      responses:
        '200':
          description: Crop catalog; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalog/strategies:
    get:
      operationId: listStrategies
      summary: Read available versioned strategies.
      responses:
        '200':
          description: Paginated strategy catalog; item DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStrategyCatalogItem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalog/strategies/{id}/versions/{v}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getStrategyVersion
      summary: Read one immutable strategy version.
      responses:
        '200':
          description: Strategy version; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalog/references:
    get:
      operationId: listReferences
      summary: Read cited reference entries.
      responses:
        '200':
          description: References; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/zones/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createAnalysisRun
      summary: Enqueue a base run.
      description: Technician/admin only; the exact run request schema is not specified in §15.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenObject'
      responses:
        '202':
          description: Analysis job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getRun
      summary: Read run state, mode, reasons and reproducibility hashes.
      responses:
        '200':
          description: Run status; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/scenarios:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listRunScenarios
      summary: List scenario/adaptation combinations already computed.
      responses:
        '200':
          description: Available combinations; exact collection DTO is not specified in §15.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioTag'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: runScenarios
      summary: Enqueue scenario grid or requested combinations.
      description: Technician/admin only; request fields are not specified in §15.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRunRequest'
      responses:
        '202':
          description: Scenario job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/climate-history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getClimateHistory
      summary: Read 25-year climate summary and descriptive trends.
      responses:
        '200':
          description: Climate-history DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClimateHistoryDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: scenario
        in: query
        required: true
        schema:
          type: string
      - name: adaptation
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AdaptationMode'
    get:
      operationId: getRunSummary
      summary: Read paginated risk results by strategy and cycle.
      responses:
        '200':
          description: Paginated strategy risk summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStrategyRiskDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/heatmap:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: view
        in: query
        required: true
        schema:
          type: string
          enum: [cycle, strategy]
      - name: strategy
        in: query
        required: true
        schema:
          type: string
      - name: cycle
        in: query
        schema:
          type: integer
      - name: variety
        in: query
        schema:
          type: string
      - name: scenario
        in: query
        required: true
        schema:
          type: string
      - name: adaptation
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AdaptationMode'
    get:
      operationId: getHeatmap
      summary: Read planting-date heatmap by cycle or strategy.
      responses:
        '200':
          description: Heatmap payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/dekad-chart:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: strategy
        in: query
        required: true
        schema:
          type: string
      - name: cohort_year
        in: query
        required: true
        schema:
          type: integer
      - name: cycle
        in: query
        required: true
        schema:
          type: integer
      - name: plant_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: scenario
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: getDekadChart
      summary: Read one cohort/cycle chart.
      responses:
        '200':
          description: Dekad chart payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DekadChartDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/rank:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rankStrategies
      summary: Recalculate ranking and weight sensitivity from persisted results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankRequest'
      responses:
        '200':
          description: Ranking, partial table, stability and explanations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/runs/{id}/soil-voi:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: calculateSoilVoi
      summary: Evaluate the value of soil pH information.
      responses:
        '200':
          description: Soil VoI result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilVoiResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/provenance/{ip_id}:
    parameters:
      - name: ip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProvenance
      summary: Read complete provenance for an indicator.
      responses:
        '200':
          description: Indicator provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceInfo'
        default:
          $ref: '#/components/responses/Problem'
  /v1/reports:
    post:
      operationId: createReport
      summary: Enqueue backend report generation.
      description: >-
        Draft request fields are inferred from report.report (§13) and the
        user-visible choices in §18; R3 must confirm them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestDraft'
      responses:
        '202':
          description: Report job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Problem'
  /v1/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getReport
      summary: Read report status and sections.
      responses:
        '200':
          description: Report metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDTO'
        default:
          $ref: '#/components/responses/Problem'
  /v1/reports/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: downloadReportPdf
      summary: Download the backend-generated PDF.
      responses:
        '200':
          description: PDF generated by the backend.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        default:
          $ref: '#/components/responses/Problem'
  /v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getJob
      summary: Read job state and progress.
      responses:
        '200':
          description: Job; exact DTO is not specified in §15.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cancelJob
      summary: Cancel a job where permitted.
      responses:
        '204':
          description: Job cancellation accepted.
        default:
          $ref: '#/components/responses/Problem'
  /v1/healthz:
    get:
      operationId: getHealth
      summary: Read service health without private data.
      security: []
      responses:
        '200':
          description: Public health state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 7807 error extended with project code and hint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OpenObject:
      type: object
      additionalProperties: true
      description: >-
        Payload not fully specified in the architecture PDF. Kept open in this
        R4 draft; do not infer or present its fields as official.
    PageOpenObject:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OpenObject' }
        next_cursor: { type: [string, 'null'] }
      additionalProperties: false
    PageStrategyRiskDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StrategyRiskDTO' }
        next_cursor: { type: [string, 'null'] }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
      additionalProperties: false
    Session:
      type: object
      required: [access_token, expires_in, role]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds. }
        role:
          type: string
          enum: [tecnico, agricultor, admin]
      additionalProperties: true
    JobStatus:
      type: string
      enum: [queued, running, ok, failed, cancelled]
    Job:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: [number, 'null'], minimum: 0, maximum: 1 }
        result:
          type: [object, 'null']
          description: "Draft: may carry report_id or run_id once status is ok."
          properties:
            report_id: { type: [string, 'null'] }
            run_id: { type: [string, 'null'] }
          additionalProperties: true
        error: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }
      additionalProperties: true
    RunDTO:
      type: object
      required: [run_id, status, mode, label, mode_reasons]
      properties:
        run_id: { type: string }
        status: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
        label: { $ref: '#/components/schemas/Label' }
        mode_reasons:
          type: array
          items: { type: string }
        sandbox: { type: boolean, description: "True when catalogs carry pending parameters." }
        synthetic_fixture: { type: boolean, description: "True for labeled synthetic test fixtures." }
        code_version: { type: [string, 'null'] }
        region_config_hash: { type: [string, 'null'] }
        catalog_hash: { type: [string, 'null'] }
        data_hash: { type: [string, 'null'] }
        params_hash: { type: [string, 'null'] }
        seed: { type: [integer, 'null'] }
      additionalProperties: true
    ZoneCell:
      type: object
      required: [cell_id, source, weight, south, west, north, east]
      description: "Zone-level climate cell (never a parcel). Bounds are the cell extent."
      properties:
        cell_id: { type: string }
        source: { type: string }
        weight: { $ref: '#/components/schemas/IndicatorNumber' }
        south: { type: number }
        west: { type: number }
        north: { type: number }
        east: { type: number }
      additionalProperties: false
    ZoneCrop:
      type: object
      required: [code, name_es, name_en, seasons, calendar_validated]
      properties:
        code: { type: string }
        name_es: { type: string }
        name_en: { type: string }
        seasons:
          type: array
          items: { type: string }
        calendar_validated: { type: boolean, description: "false renders the pending mark." }
      additionalProperties: false
    ZoneContext:
      type: object
      properties:
        state: { type: string }
        message: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/ZoneCell' }
        crops:
          type: array
          items: { $ref: '#/components/schemas/ZoneCrop' }
        pending:
          type: array
          items: { type: string }
        synthetic_fixture: { type: boolean }
      additionalProperties: true
    CoverageRow:
      type: object
      required: [variable, year, missing_pct]
      properties:
        variable: { type: string }
        year: { type: integer }
        missing_pct: { $ref: '#/components/schemas/IndicatorNumber' }
      additionalProperties: false
    SourceComparison:
      type: object
      required: [pair, bias, correlation]
      properties:
        pair: { type: string, description: "For example IMERG vs POWER." }
        bias: { $ref: '#/components/schemas/IndicatorNumber' }
        correlation: { $ref: '#/components/schemas/IndicatorNumber' }
      additionalProperties: false
    DataQualityDTO:
      type: object
      properties:
        state: { type: string }
        message: { type: string }
        coverage:
          type: array
          items: { $ref: '#/components/schemas/CoverageRow' }
        comparisons:
          type: array
          items: { $ref: '#/components/schemas/SourceComparison' }
        ea_sensitivity: { oneOf: [{ $ref: '#/components/schemas/IndicatorNumber' }, { type: 'null' }] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
      additionalProperties: true
    ClimateYear:
      type: object
      required: [year, precip_mm, et0_mm, n_valid_days]
      properties:
        year: { type: integer }
        precip_mm: { $ref: '#/components/schemas/IndicatorNumber' }
        et0_mm: { $ref: '#/components/schemas/IndicatorNumber' }
        n_valid_days: { $ref: '#/components/schemas/IndicatorInteger' }
      additionalProperties: false
    ClimateTrend:
      type: object
      required: [variable, change_per_decade, description_es]
      properties:
        variable: { type: string }
        change_per_decade: { $ref: '#/components/schemas/IndicatorNumber' }
        description_es: { type: string }
      additionalProperties: false
    ClimateHistoryDTO:
      type: object
      properties:
        state: { type: string }
        message: { type: string }
        years:
          type: array
          items: { $ref: '#/components/schemas/ClimateYear' }
        trends:
          type: array
          items: { $ref: '#/components/schemas/ClimateTrend' }
        provenance: { $ref: '#/components/schemas/ProvenanceInfo' }
      additionalProperties: true
    ParcelDTO:
      type: object
      required: [parcel_id, zone_id]
      properties:
        parcel_id: { type: string }
        zone_id: { type: string }
        display_grid_m: { type: [integer, 'null'], description: "Generalization grid, at least 1000 m." }
        display_lat: { type: [number, 'null'], description: "Grid-snapped center, never an exact point." }
        display_lon: { type: [number, 'null'] }
      additionalProperties: false
    SoilUploadForm:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    SoilRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer }

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres_test_only@127.0.0.1:5432/postgres

jobs:
  quality:
    name: Lint, tipos, pruebas, contrato, OpenAPI, auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Bibliotecas nativas de WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
      - name: Instalación reproducible (uv.lock)
        run: uv sync --frozen --all-packages --all-groups
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: mypy (estricto)
        run: uv run mypy
      - name: OpenAPI versionado = generado
        run: |
          uv run --all-packages python -m api.cli openapi --out docs/openapi/openapi.json
          git diff --exit-code docs/openapi/openapi.json
      - name: Pruebas (unitarias, propiedades, contrato, integración, seguridad, privacidad, PDF)
        run: uv run pytest -q --junitxml=test-results.xml
      - name: pip-audit
        run: |
          uv export --frozen --all-packages --no-hashes --no-emit-workspace -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --no-deps --disable-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact --exit-code 1

  docker:
    name: Imágenes y arranque de Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: .env efímero de CI (valores NO secretos, solo para este job)
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=ci-postgres-$(openssl rand -hex 8)"
            echo "APP_DB_PASSWORD=ci-app-$(openssl rand -hex 8)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> .env
      - name: Build
        run: docker compose build
      - name: Arranque y healthcheck (/healthz)
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs --no-color | tail -80
          exit 1
      - name: Comprobaciones de privilegios
        run: |
          docker compose exec -T db psql -U milpa_owner -d milpa -tAc "select rolsuper, rolbypassrls from pg_roles where rolname='milpa_app'" | grep -x 'f|f'
          docker compose exec -T app id -u | grep -x 10001
      - if: always()
        run: docker compose down -v

  web:
    name: "Frontend (R4) - tipos desde el OpenAPI de R3, lint, tipos, pruebas y build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Los tipos generados coinciden con docs/openapi/openapi.json
        run: |
          npm run web:types
          git diff --exit-code apps/web/src/api/types.gen.ts
      - run: npm run lint --workspace @milpa-resiliente/web
      - run: npm run typecheck --workspace @milpa-resiliente/web
      - run: npm run web:test
      - run: npm run web:build
      - name: Auditoría de dependencias de Node (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

  web-e2e:
    name: "E2E T-UI y T-A (Playwright + axe) contra el fixture sintetico rotulado"
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run web:test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

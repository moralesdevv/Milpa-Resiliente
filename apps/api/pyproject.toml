[project]
name = "milpa-api"
version = "0.1.0"
description = "MILPA RESILIENTE 3.3 - R3 Backend y plataforma (FastAPI)"
requires-python = ">=3.12,<3.13"
# Versiones: rangos de compatibilidad verificados en la resolución del 2026-11-14; las versiones
# exactas están fijadas en uv.lock (la instalación en CI/Docker usa --frozen).
dependencies = [
  "fastapi>=0.163,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",   # ADR-002: configuración validada al arrancar
  "sqlalchemy>=2.1,<3",
  "alembic>=1.20,<2",
  "geoalchemy2>=0.21,<1",
  "psycopg[binary]>=3.3,<4",      # ADR-002: driver PostgreSQL
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.15,<3",
  "jinja2>=3.1,<4",
  "weasyprint>=70,<71",           # requiere Pango (imagen Docker)
  "pandas>=3.1,<4",
  "numpy>=2.5,<3",
  "pyarrow>=26,<27",
  "pandera>=0.36,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "hypothesis>=6.170,<7",
  "schemathesis>=4.33,<5",
  "httpx>=0.28,<1",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "pandas-stubs>=3.1",
  "pip-audit>=2.10,<3",
  "pypdf>=7.1,<8",                # solo pruebas: extrae texto de PDFs generados
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
